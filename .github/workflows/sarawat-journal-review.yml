name: Sarawat journal review
on:
  pull_request:
  push:
    branches:
      - development/sarawat-journal-review
jobs:
  review-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_sarawat_journal_review.py
